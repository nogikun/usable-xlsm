[project]
name = "usable-xlsm"
version = "0.3.0"
description = "Portable VBA development and candidate creation with production-safe Windows Excel releases"
readme = "README.md"
authors = [
    { name = "nogikun", email = "ok220075@oks.iput.ac.jp" }
]
requires-python = ">=3.13"
dependencies = [
    "antlr4-python3-runtime>=4.13.2",
    "antlr4-vba>=0.0.67",
    "oletools>=0.60.2",
    "pywin32>=312; sys_platform == 'win32'",
    "typer>=0.27.1",
    "xlsxwriter>=3.2.9",
]

[project.scripts]
usable-xlsm = "usable_xlsm.cli:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
